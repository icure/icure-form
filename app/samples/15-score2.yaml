              male: Male
          - field: ageYears
            type: number-field
            shortLabel: Age (years)
            span: 4
          - field: smoker
            type: checkbox
            shortLabel: Current smoker
            span: 6
            options:
              yes: Yes
          - field: diabetes
            type: checkbox
            shortLabel: Diabetes
            span: 6
            options:
              yes: Yes
          - field: systolicBp
            type: number-field
            shortLabel: Systolic BP (mmHg)
            span: 8
          - field: totalCholesterol
            type: number-field
            shortLabel: Total cholesterol (mmol/L)
            span: 8
          - field: hdlCholesterol
            type: number-field
            shortLabel: HDL cholesterol (mmol/L)
            span: 8
          - field: riskRegion
            type: radio-button
            shortLabel: Risk region
            span: 24
            styleOptions:
              direction: row
            options:
              low: Low (BE, CH, FR, NL, …)
              moderate: Moderate
              high: High
              veryHigh: Very high
  - section: SCORE2
    fields:
      - group: line
        borderless: true
        span: 24
        fields:
          - field: score2Risk
            type: number-field
            shortLabel: 10-year CVD risk (%)
            span: 12
            readonly: true
            computedProperties:
              value: |
                // Read every input before any early return: the bridge records a formula's
                // dependencies as it reads them, and an input skipped here would not trigger a recompute.
                const isFemale = hasOption(sex[0], 'female')
                const isMale = hasOption(sex[0], 'male')
                const age = parseContent(ageYears[0]?.content)
                const smoking = hasOption(smoker[0], 'yes') ? 1 : 0
                const diabetic = hasOption(diabetes[0], 'yes') ? 1 : 0
                const sbp = parseContent(systolicBp[0]?.content)
                const tchol = parseContent(totalCholesterol[0]?.content)
                const hdl = parseContent(hdlCholesterol[0]?.content)
                const region = ['moderate', 'high', 'veryHigh'].find((r) => hasOption(riskRegion[0], r)) ?? 'low'
                if ((!isFemale && !isMale) || age == null || sbp == null || tchol == null || hdl == null) { return undefined }
                if (age < 40 || age > 69) { return undefined }

                const cage = (age - 60) / 5
                const csbp = (sbp - 120) / 20
                const ctchol = tchol - 6
                const chdl = (hdl - 1.3) / 0.5
                // SCORE2 Working Group, Eur Heart J 2021;42:2439 — sex-specific coefficients and baseline survival
                const b = isMale
                  ? { age: 0.3742, smk: 0.6012, sbp: 0.2777, dm: 0.6457, tchol: 0.1458, hdl: -0.2698, smkAge: -0.0755, sbpAge: -0.0255, tcholAge: -0.0281, hdlAge: 0.0426, dmAge: -0.0983, s0: 0.9605 }
                  : { age: 0.4648, smk: 0.7744, sbp: 0.3131, dm: 0.8096, tchol: 0.1002, hdl: -0.2606, smkAge: -0.1088, sbpAge: -0.0277, tcholAge: -0.0226, hdlAge: 0.0613, dmAge: -0.1272, s0: 0.9776 }
                const x = b.age * cage + b.smk * smoking + b.sbp * csbp + b.dm * diabetic + b.tchol * ctchol + b.hdl * chdl
                  + b.smkAge * smoking * cage + b.sbpAge * csbp * cage + b.tcholAge * ctchol * cage + b.hdlAge * chdl * cage + b.dmAge * diabetic * cage
                const uncalibrated = 1 - Math.pow(b.s0, Math.exp(x))
                // Region- and sex-specific recalibration [scale1, scale2]
                const scales = {
                  low: isMale ? [-0.5699, 0.7476] : [-0.738, 0.7019],
                  moderate: isMale ? [-0.1565, 0.8009] : [-0.3143, 0.7701],
                  high: isMale ? [0.3207, 0.936] : [0.571, 0.9369],
                  veryHigh: isMale ? [0.5836, 0.8294] : [0.9412, 0.8329],
                }[region]
                const risk = 1 - Math.exp(-Math.exp(scales[0] + scales[1] * Math.log(-Math.log(1 - uncalibrated))))
                return { content: { '*': { type: 'number', value: Math.round(risk * 1000) / 10 } }, codes: [] }
          - field: score2Category
            type: text-field
            shortLabel: Risk category
            span: 12
            readonly: true
            computedProperties:
              value: |
                const age = parseContent(ageYears[0]?.content)
                const risk = parseContent(score2Risk[0]?.content)
                const diabetic = hasOption(diabetes[0], 'yes')
                if (age != null && (age < 40 || age > 69)) { return 'SCORE2 applies from 40 to 69 years (use SCORE2-OP from 70)' }
                if (diabetic) { return 'SCORE2 is not validated in diabetes — use SCORE2-Diabetes' }
                if (risk == null || age == null) { return undefined }
                // ESC 2021 prevention guidelines: thresholds depend on age
                const [high, veryHigh] = age < 50 ? [2.5, 7.5] : [5, 10]
                return risk < high ? 'Low to moderate' : risk < veryHigh ? 'High' : 'Very high'
      - field: "SCORE2 (ESC 2021): sex-specific Cox model on age, smoking, systolic BP, total and HDL cholesterol and diabetes, with their age interactions, recalibrated to the chosen risk region (Belgium, Switzerland, France and the Netherlands are low-risk countries; an unanswered region counts as low). Only valid from 40 to 69 years in people without established CVD or diabetes (ticking Diabetes still computes the risk but the category points to SCORE2-Diabetes). Categories: below 50 years, <2.5% low-to-moderate, 2.5–7.5% high, ≥7.5% very high; 50–69 years, <5%, 5–10%, ≥10%. Test: Male, 50 years, smoker, no diabetes, SBP 140, total cholesterol 5.5, HDL 1.3, region Low — risk ≈ 5.9%, category High."
        type: label
        span: 24
