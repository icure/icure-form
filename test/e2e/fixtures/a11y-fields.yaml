form: A11y fields
description: One field of each editor kind, a required field, a range validator and a repeatable subform (issue #17).
sections:
  - section: Fields
    fields:
      - field: fullName
        type: text-field
        shortLabel: Full name
        span: 12
        required: true
        validators:
          - validation: |
              return validate.notBlank(self, 'fullName')
            message: Please enter the patient's full name.
      - field: weight
        type: measure-field
        shortLabel: Weight
        span: 12
      - field: count
        type: number-field
        shortLabel: Count
        span: 12
        validators:
          - validation: |
              const m = parseContent(self['count']?.[0]?.content)
              return m === undefined || m === null || (m >= 1 && m <= 10)
            message: Count must be between 1 and 10.
      - field: visit
        type: date-time-picker
        shortLabel: Visit
        span: 12
      - field: birthDate
        type: date-picker
        shortLabel: Birth date
        span: 12
        required: true
  - section: Repeated
    fields:
      - subform: Notes
        id: notes
        shortLabel: Notes
        span: 24
        forms:
          note:
            form: Note
            sections:
              - section: Note
                fields:
                  - field: noteText
                    type: text-field
                    shortLabel: Note
                    span: 24
  - section: Choices
    fields:
      - field: size
        type: radio-button
        shortLabel: Size
        span: 12
        required: true
        options:
          size|s|1: Small
          size|m|1: Medium
          size|l|1: Large
      - field: fruits
        type: checkbox
        shortLabel: Fruits
        span: 12
        options:
          fruits|a|1: Apples
          fruits|b|1: Bread
        validators:
          - validation: |
              return (self['fruits']?.[0]?.codes?.length ?? 0) <= 1
            message: Pick one fruit at most.
      - field: consent
        type: checkbox
        shortLabel: I consent
        span: 12
      - field: smoker
        type: checkbox
        shortLabel: Smoker
        span: 12
        options:
          smoker|yes|1: Smoker
